server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /petclinic/;
    }

    location = /petclinic/assets/runtime-config.js {
        alias /var/run/petclinic-runtime-config.js;
        add_header Cache-Control "no-store" always;
    }

    location /petclinic/ {
        try_files $uri $uri/ /petclinic/index.html;
    }
}
